<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitBuddy</title><link rel="stylesheet" href="/static/style.css"></head><body class="hero"><main class="container card"><div class="brand">FITBUDDY</div><h1>AI Fitness Plan Generator</h1><p>Create a personalized 7-day workout plan with Gemini AI.</p><form action="/generate-workout" method="post" class="form-grid"><label>Name<input name="username" required></label><label>User ID<input name="user_id" required></label><label>Age<input type="number" name="age" min="13" max="100" required></label><label>Weight (kg)<input type="number" name="weight" min="1" step="0.1" required></label><label>Fitness Goal<select name="goal"><option>weight loss</option><option>muscle gain</option><option>general wellness</option><option>flexibility</option></select></label><label>Workout Intensity<select name="intensity"><option>low</option><option selected>medium</option><option>high</option></select></label><button class="btn primary full">Generate Plan</button></form><div class="links"><a href="/view-all-users">Admin / View All Users</a><a href="/docs">API Documentation</a></div></main></body></html>
